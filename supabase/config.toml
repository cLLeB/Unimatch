[auth]
# The sign-in link landed on http://localhost:3000 because this was still the
# Supabase default. It must be the live site, or every emailed link is broken
# for a real student.
site_url = "https://unimatchgh.app"

# Any URL a magic link may return to has to be listed, or Supabase silently
# falls back to site_url.
additional_redirect_urls = [
  "https://unimatchgh.app",
  "https://unimatchgh.app/**",
  "https://www.unimatchgh.app",
  "https://www.unimatchgh.app/**",
  "https://unimatch-ghana-e5dff32fb7a4.herokuapp.com/**",
  "http://localhost:5173/**",
]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
enable_confirmations = true
# Resend is the sending domain, so mail arrives from UniMatch Ghana rather than
# from Supabase's shared pool, and is no longer rate limited to their quota.
max_frequency = "60s"

# Branded wording, so a student sees who the mail is from and why. Supabase only
# accepts these once a custom SMTP sender is configured, which it now is.
[auth.email.template.confirmation]
subject = "Confirm your email for UniMatch Ghana"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your UniMatch Ghana sign-in link"
content_path = "./supabase/templates/magic-link.html"
